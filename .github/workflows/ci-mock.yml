name: Frontend CI Mock

on:
  push:
    branches:
      - feature/**
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4
      
      - name: Ejecutar Linter (Mock)
        run: |
          echo "Iniciando análisis de código estático (Linter)..."
          echo "✅ Sin errores de formato. Código limpio."

      - name: Ejecutar Pruebas Unitarias (Mock)
        run: |
          echo "Ejecutando suite de pruebas unitarias..."
          echo "✅ 45/45 pruebas pasaron correctamente."
          
      - name: Construir el artefacto (Mock)
        run: |
          echo "Empaquetando la aplicación frontend para producción..."
          mkdir -p dist
          echo "<h1>Simulación de Frontend</h1>" > dist/index.html
          echo "✅ Artefacto construido exitosamente en la carpeta /dist."

      - name: Publicar el artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/