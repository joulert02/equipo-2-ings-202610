name: CI — Lint, Test & Build

# Runs on every push and pull request to catch problems early,
# regardless of the target branch.
on:
  push:
  pull_request:

jobs:
  # ──────────────────────────────────────────────
  # STAGE 1 — LINT (parallel: server + client)
  # ──────────────────────────────────────────────
  lint-server:
    name: "Lint · Server"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  lint-client:
    name: "Lint · Client"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ──────────────────────────────────────────────
  # STAGE 2 — TEST (parallel: server + client)
  # Each waits for its own lint job to pass first.
  # ──────────────────────────────────────────────
  test-server:
    name: "Test · Server"
    runs-on: ubuntu-latest
    needs: lint-server
    defaults:
      run:
        working-directory: server
    env:
      # Provide a safe JWT secret for the test environment
      JWT_SECRET: "ci-test-secret-at-least-16-chars"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  test-client:
    name: "Test · Client"
    runs-on: ubuntu-latest
    needs: lint-client
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  # ──────────────────────────────────────────────
  # STAGE 3 — BUILD ARTIFACTS (parallel: server + client)
  # Runs only after all tests pass.
  # ──────────────────────────────────────────────
  build-server:
    name: "Build · Server"
    runs-on: ubuntu-latest
    needs: test-server
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI & build artifact
        run: |
          npm install -g vercel@latest
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_SERVER }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: server/.vercel/output
          retention-days: 1

  build-client:
    name: "Build · Client"
    runs-on: ubuntu-latest
    needs: test-client
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI & build artifact
        run: |
          npm install -g vercel@latest
          vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENT }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-build
          path: client/.vercel/output
          retention-days: 1
